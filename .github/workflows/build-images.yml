          printf '%s\n' "GERALT_DBG remote=$(git remote get-url origin 2>/dev/null || printf unknown)"
        else
          printf '%s\n' "GERALT_DBG git=missing"
        fi
        if [ -f pkg/web/Dockerfile ]; then
          printf '%s\n' "GERALT_DBG dashboard_Dockerfile=present"
        else
          printf '%s\n' "GERALT_DBG dashboard_Dockerfile=missing"
        fi
        if [ -f "$HOME/.docker/config.json" ]; then
          printf '%s\n' "GERALT_DBG docker_config=present"
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.docker/config.json')));a=sorted(d.get('auths',{}).keys());print('GERALT_DBG auths='+(','.join(a) if a else 'none'))" 2>/dev/null || printf '%s\n' "GERALT_DBG docker_config_unreadable"
