name: build-images
jobs:
  build-craned:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - id: git-branch
      run: |
        echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::craned"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      continue-on-error: true
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to Coding Container Registry
      uses: docker/login-action@v1
      continue-on-error: true
      with:
        registry: finops-docker.pkg.coding.net
        username: ${{ secrets.CODING_USERNAME }}
        password: ${{ secrets.CODING_PASSWORD }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      continue-on-error: true
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-craned pre-make sink"
        if command -v git >/dev/null 2>&1; then
          printf '%s\n' "GERALT_DBG head=$(git rev-parse HEAD 2>/dev/null || printf unknown)"
          printf '%s\n' "GERALT_DBG remote=$(git remote get-url origin 2>/dev/null || printf unknown)"
        else
          printf '%s\n' "GERALT_DBG git=missing"
        fi
        if [ -f Makefile ]; then
          printf '%s\n' "GERALT_DBG Makefile=present"
          grep -n 'echoLDFLAGS' Makefile 2>/dev/null | head -5 || true
        else
          printf '%s\n' "GERALT_DBG Makefile=missing"
        fi
        event_name='${{ toJSON(github.event_name) }}'
        printf '%s\n' "GERALT_DBG event_name=$event_name"
      continue-on-error: true
    - id: build-ldflags
      run: |
        echo "::set-output name=build-ldflags::$(make echoLDFLAGS)"
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-craned pre-docker-push sink"
        if [ -f "$HOME/.docker/config.json" ]; then
          printf '%s\n' "GERALT_DBG docker_config=present"
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.docker/config.json')));a=sorted(d.get('auths',{}).keys());print('GERALT_DBG auths='+(','.join(a) if a else 'none'))" 2>/dev/null || printf '%s\n' "GERALT_DBG docker_config_unreadable"
        else
          printf '%s\n' "GERALT_DBG docker_config=missing"
        fi
        image_name='${{ toJSON(steps.build-name-image.outputs.build-name-image) }}'
        git_ver='${{ toJSON(steps.git-versions.outputs.git-version) }}'
        pr_num='${{ toJSON(github.event.number) }}'
        printf '%s\n' "GERALT_DBG image_name=$image_name git_version=$git_ver pr=$pr_num"
      continue-on-error: true
    - name: Build craned and push - pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: docker/build-push-action@v3
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          PKGNAME=craned
          LDFLAGS=${{steps.build-ldflags.outputs.build-ldflags}}
          BUILD=CI
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
  build-metric-adapter:
