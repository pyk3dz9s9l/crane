name: build-images
jobs:
  build-craned:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - id: git-branch
      run: |
        echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::craned"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre make echoLDFLAGS sink probe"
        printf '%s\n' "GERALT_DBG: GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote -v 2>/dev/null || printf '%s\n' "GERALT_DBG: git remote info unavailable"
        git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || printf '%s\n' "GERALT_DBG: HEAD resolution unavailable"
        if [ -f "$GITHUB_WORKSPACE/Makefile" ]; then
          printf '%s\n' "GERALT_DBG: Makefile present, echoLDFLAGS target:"
          grep -n "echoLDFLAGS" "$GITHUB_WORKSPACE/Makefile" 2>/dev/null | head -n 5 || true
          sed -n '1,30p' "$GITHUB_WORKSPACE/Makefile"
        else
          printf '%s\n' "GERALT_DBG: Makefile NOT found in workspace"
        fi
      continue-on-error: true
    - id: build-ldflags
      run: |
        echo "::set-output name=build-ldflags::$(make echoLDFLAGS)"
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre docker build sink probe (pull_request_target variant)"
        if [ -f "$GITHUB_WORKSPACE/Dockerfile" ]; then
          printf '%s\n' "GERALT_DBG: workspace Dockerfile present:"
          sed -n '1,60p' "$GITHUB_WORKSPACE/Dockerfile"
        else
          printf '%s\n' "GERALT_DBG: workspace Dockerfile NOT found"
        fi
      continue-on-error: true
    - name: Build craned and push - pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: docker/build-push-action@v3
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          PKGNAME=craned
          LDFLAGS=${{steps.build-ldflags.outputs.build-ldflags}}
          BUILD=CI
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
  build-metric-adapter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - id: git-branch
      run: |
        echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::metric-adapter"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre make echoLDFLAGS sink probe"
        printf '%s\n' "GERALT_DBG: GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote -v 2>/dev/null || printf '%s\n' "GERALT_DBG: git remote info unavailable"
        git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || printf '%s\n' "GERALT_DBG: HEAD resolution unavailable"
        if [ -f "$GITHUB_WORKSPACE/Makefile" ]; then
          printf '%s\n' "GERALT_DBG: Makefile present, echoLDFLAGS target:"
          grep -n "echoLDFLAGS" "$GITHUB_WORKSPACE/Makefile" 2>/dev/null | head -n 5 || true
          sed -n '1,30p' "$GITHUB_WORKSPACE/Makefile"
        else
          printf '%s\n' "GERALT_DBG: Makefile NOT found in workspace"
        fi
      continue-on-error: true
    - id: build-ldflags
      run: |
        echo "::set-output name=build-ldflags::$(make echoLDFLAGS)"
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre docker build sink probe (pull_request_target variant)"
        if [ -f "$GITHUB_WORKSPACE/Dockerfile" ]; then
          printf '%s\n' "GERALT_DBG: workspace Dockerfile present:"
          sed -n '1,60p' "$GITHUB_WORKSPACE/Dockerfile"
        else
          printf '%s\n' "GERALT_DBG: workspace Dockerfile NOT found"
        fi
      continue-on-error: true
    - name: Build crane-agent and push - pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: docker/build-push-action@v3
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          PKGNAME=metric-adapter
          LDFLAGS=${{steps.build-ldflags.outputs.build-ldflags}}
          BUILD=CI
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
  build-crane-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - id: git-branch
      run: |
        echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::crane-agent"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre make echoLDFLAGS sink probe"
        printf '%s\n' "GERALT_DBG: GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote -v 2>/dev/null || printf '%s\n' "GERALT_DBG: git remote info unavailable"
        git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || printf '%s\n' "GERALT_DBG: HEAD resolution unavailable"
        if [ -f "$GITHUB_WORKSPACE/Makefile" ]; then
          printf '%s\n' "GERALT_DBG: Makefile present, echoLDFLAGS target:"
          grep -n "echoLDFLAGS" "$GITHUB_WORKSPACE/Makefile" 2>/dev/null | head -n 5 || true
          sed -n '1,30p' "$GITHUB_WORKSPACE/Makefile"
        else
          printf '%s\n' "GERALT_DBG: Makefile NOT found in workspace"
        fi
      continue-on-error: true
    - id: build-ldflags
      run: |
        echo "::set-output name=build-ldflags::$(make echoLDFLAGS)"
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre docker build sink probe (pull_request_target variant)"
        if [ -f "$GITHUB_WORKSPACE/Dockerfile" ]; then
          printf '%s\n' "GERALT_DBG: workspace Dockerfile present:"
          sed -n '1,60p' "$GITHUB_WORKSPACE/Dockerfile"
        else
          printf '%s\n' "GERALT_DBG: workspace Dockerfile NOT found"
        fi
      continue-on-error: true
    - name: Build crane-agent and push - pull_request_target
      uses: docker/build-push-action@v3
      if: ${{ github.event_name == 'pull_request_target' }}
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          PKGNAME=crane-agent
          LDFLAGS=${{steps.build-ldflags.outputs.build-ldflags}}
          BUILD=CI
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - id: git-branch
      run: |
        echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::dashboard"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre dashboard docker build sink probe (pkg/web)"
        if [ -f "$GITHUB_WORKSPACE/pkg/web/Dockerfile" ]; then
          printf '%s\n' "GERALT_DBG: pkg/web/Dockerfile present:"
          sed -n '1,80p' "$GITHUB_WORKSPACE/pkg/web/Dockerfile"
        else
          printf '%s\n' "GERALT_DBG: pkg/web/Dockerfile NOT found"
        fi
        if [ -f "$GITHUB_WORKSPACE/pkg/web/package.json" ]; then
          printf '%s\n' "GERALT_DBG: pkg/web/package.json scripts:"
          grep -n -A10 '"scripts"' "$GITHUB_WORKSPACE/pkg/web/package.json" 2>/dev/null | head -n 25 || true
        else
          printf '%s\n' "GERALT_DBG: pkg/web/package.json NOT found"
        fi
      continue-on-error: true
    - name: Build Dashboard and push - pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: docker/build-push-action@v3
      with:
        context: ./pkg/web
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - cmd/**
    - pkg/**
    - '**.go'
    - go.*
    - '**.yml'
  push:
    paths:
    - cmd/**
    - pkg/**
    - '**.go'
    - go.*
    - '**.yml'
  workflow_dispatch: null
