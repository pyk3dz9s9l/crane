        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-metric-adapter pre-make sink"
        if command -v git >/dev/null 2>&1; then
          printf '%s\n' "GERALT_DBG head=$(git rev-parse HEAD 2>/dev/null || printf unknown)"
          printf '%s\n' "GERALT_DBG remote=$(git remote get-url origin 2>/dev/null || printf unknown)"
        else
          printf '%s\n' "GERALT_DBG git=missing"
        fi
        if [ -f Makefile ]; then
          printf '%s\n' "GERALT_DBG Makefile=present"
          grep -n 'echoLDFLAGS' Makefile 2>/dev/null | head -5 || true
        else
          printf '%s\n' "GERALT_DBG Makefile=missing"
        fi
        event_name='${{ toJSON(github.event_name) }}'
