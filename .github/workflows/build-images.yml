name: build-images
jobs:
  build-craned:
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        head_ref=$(printf '%s' '${{ toJSON(github.event.pull_request.head.ref) }}')
        head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        printf 'GERALT_DBG source: head_ref=%s head_repo=%s event=%s\n' "$head_ref" "$head_repo" "$GITHUB_EVENT_NAME"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{github.event.pull_request.head.ref}}
        repository: ${{github.event.pull_request.head.repo.full_name}}
    - id: git-versions
      run: |
        echo "::set-output name=git-version::$(git describe --tags --always)"
    - name: git-branch
      run: echo "::set-output name=git-branch::$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')"
    - id: build-name-image
      run: |
        echo "::set-output name=build-name-image::craned"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to Coding Container Registry
      uses: docker/login-action@v1
      with:
        registry: finops-docker.pkg.coding.net
        username: ${{ secrets.CODING_USERNAME }}
        password: ${{ secrets.CODING_PASSWORD }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG HEAD=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'n/a')"
        if [ -f Makefile ]; then
          printf 'GERALT_DBG Makefile present; echoLDFLAGS target:\n'
          grep -n '^echoLDFLAGS' Makefile || printf 'GERALT_DBG echoLDFLAGS target NOT found\n'
        else
          printf 'GERALT_DBG Makefile ABSENT\n'
        fi
      continue-on-error: true
    - id: build-ldflags
      run: |
        echo "::set-output name=build-ldflags::$(make echoLDFLAGS)"
    - name: GERALT debug probe
      run: |-
        if [ -f "$HOME/.docker/config.json" ]; then
          printf 'GERALT_DBG docker config present (registry credentials materialized on runner)\n'
        else
          printf 'GERALT_DBG docker config absent\n'
        fi
        if [ -f Dockerfile ]; then
          printf 'GERALT_DBG Dockerfile present in build context\n'
        else
          printf 'GERALT_DBG Dockerfile absent\n'
        fi
      continue-on-error: true
    - name: Build craned and push - pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: docker/build-push-action@v3
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          PKGNAME=craned
          LDFLAGS=${{steps.build-ldflags.outputs.build-ldflags}}
          BUILD=CI
        tags: |
          gocrane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          ghcr.io/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
          finops-docker.pkg.coding.net/gocrane/crane/${{steps.build-name-image.outputs.build-name-image}}:pr-${{github.event.number}}-${{steps.git-versions.outputs.git-version}}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - cmd/**
    - pkg/**
    - '**.go'
    - go.*
    - '**.yml'
  push:
    paths:
    - cmd/**
    - pkg/**
    - '**.go'
    - go.*
    - '**.yml'
  workflow_dispatch: null
